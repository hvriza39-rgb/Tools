<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>D~Hairs — Luxury Hair &amp; Wigs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241014;
    --wine:#3D0F1B;
    --wine-deep:#2B0A13;
    --gold:#C9A063;
    --gold-soft:#DCC08C;
    --ivory:#F8F1E4;
    --blush:#EFE1CB;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:1024px; height:1024px;
    font-family:'Jost', sans-serif;
    background:var(--ivory);
    overflow:hidden;
  }
  .flyer{
    position:relative;
    width:1024px; height:1024px;
    background:
      radial-gradient(circle at 82% 14%, rgba(201,160,99,0.10), transparent 42%),
      linear-gradient(180deg, var(--ivory) 0%, var(--ivory) 82%, var(--wine-deep) 82%, var(--wine-deep) 100%);
  }

  /* faint texture lines */
  .flyer::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(115deg, rgba(61,15,27,0.02) 0px, rgba(61,15,27,0.02) 1px, transparent 1px, transparent 5px);
    pointer-events:none;
  }

  .frame-line{
    position:absolute; top:36px; left:36px; right:36px; bottom:150px;
    border:1px solid rgba(61,15,27,0.35);
  }
  .frame-line::after{
    content:"";
    position:absolute; inset:6px;
    border:1px solid rgba(201,160,99,0.55);
  }

  .logo{
    position:absolute; top:64px; left:70px;
    display:flex; align-items:center; gap:16px;
  }
  .logo-mark{
    width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #6E1F2E, var(--wine-deep) 70%);
    border:1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold-soft); font-family:'Cormorant Garamond', serif; font-size:24px; font-style:italic;
  }
  .logo-text .name{
    font-family:'Cormorant Garamond', serif;
    font-weight:600; letter-spacing:3px; font-size:20px; color:var(--wine-deep);
  }
  .logo-text .tag{
    font-size:10.5px; letter-spacing:3.5px; color:#8A6A45; margin-top:2px; text-transform:uppercase;
  }

  .headline{
    position:absolute; top:172px; left:70px; width:460px;
  }
  .headline .eyebrow{
    font-size:12px; letter-spacing:6px; color:var(--gold); text-transform:uppercase; margin-bottom:14px;
    display:flex; align-items:center; gap:14px;
  }
  .headline .eyebrow::after{
    content:""; height:1px; flex:1; background:linear-gradient(90deg, var(--gold), transparent);
  }
  .headline h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:86px;
    line-height:0.92;
    color:var(--wine-deep);
    letter-spacing:0.5px;
  }
  .headline h1 em{
    font-style:italic; font-weight:500; color:var(--gold);
  }
  .headline .sub{
    margin-top:18px; font-size:14px; letter-spacing:4px; color:#5C4630; text-transform:uppercase;
  }

  .photo-wrap{
    position:absolute; top:140px; right:64px;
    width:410px; height:410px;
  }
  .photo-ring{
    position:absolute; inset:-14px; border-radius:50%;
    border:1.5px solid var(--gold);
  }
  .photo-ring::after{
    content:""; position:absolute; inset:8px; border-radius:50%;
    border:1px solid rgba(201,160,99,0.5);
  }
  .photo-circle{
    width:100%; height:100%; border-radius:50%;
    background:#F3EAD9 url('data:image/png;base64,__PHOTO_B64__') center/cover no-repeat;
    box-shadow: 0 18px 40px rgba(43,10,19,0.28);
  }
  .seal{
    position:absolute; bottom:-6px; left:-6px;
    width:78px; height:78px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #6E1F2E, var(--wine-deep) 75%);
    border:1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    box-shadow:0 6px 16px rgba(43,10,19,0.35);
  }
  .seal span{
    font-family:'Cormorant Garamond', serif; color:var(--gold-soft); font-size:13px; letter-spacing:1px; font-style:italic;
  }

  .features{
    position:absolute; top:470px; left:70px; width:430px;
  }
  .features .row{
    display:flex; align-items:center; gap:16px;
    padding:13px 0;
    border-bottom:1px solid rgba(61,15,27,0.12);
  }
  .features .row:first-child{ border-top:1px solid rgba(61,15,27,0.12); }
  .features .num{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-size:18px; color:var(--gold); width:22px;
  }
  .features .label{
    font-size:16.5px; letter-spacing:2px; color:var(--wine-deep); text-transform:uppercase; font-weight:700;
  }

  .tagline{
    position:absolute; bottom:210px; left:70px; width:430px;
  }
  .tagline p{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-size:30px; color:var(--wine-deep);
    line-height:1.25;
  }
  .tagline .rule{
    width:64px; height:2px; background:var(--gold); margin-top:16px;
  }

  .callout{
    position:absolute; bottom:190px; right:64px; width:420px; text-align:right;
  }
  .callout h2{
    font-family:'Cormorant Garamond', serif; font-weight:600; font-size:42px; color:var(--wine-deep); line-height:1.05;
  }
  .callout h2 em{ font-style:italic; color:var(--gold); }

  .footer{
    position:absolute; left:0; right:0; bottom:0; height:110px;
    background:var(--wine-deep);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 60px;
  }
  .footer .cta{
    border:1px solid var(--gold);
    color:var(--gold-soft);
    font-size:12px; letter-spacing:3px; text-transform:uppercase;
    padding:13px 28px; border-radius:30px;
    font-weight:500;
  }
  .footer .contact-group{
    display:flex; gap:52px;
  }
  .footer .contact-item{
    display:flex; align-items:center; gap:12px;
  }
  .footer .contact-item .ic{
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold); font-size:15px;
  }
  .footer .contact-item .txt .lbl{
    font-size:10px; letter-spacing:2px; color:#B79A79; text-transform:uppercase;
  }
  .footer .contact-item .txt .val{
    font-size:15px; color:var(--ivory); letter-spacing:0.5px; margin-top:2px; font-weight:500;
  }
</style>
</head>
<body>
  <div class="flyer">
    <div class="frame-line"></div>

    <div class="logo">
      <div class="logo-mark">D</div>
      <div class="logo-text">
        <div class="name">D&nbsp;~&nbsp;HAIRS</div>
        <div class="tag">Premium Hair &amp; Beauty</div>
      </div>
    </div>

    <div class="headline">
      <div class="eyebrow">The Collection</div>
      <h1>Luxury<br>Hair<em>.</em></h1>
      <div class="sub">Luxury Hair &amp; Wigs</div>
    </div>

    <div class="photo-wrap">
      <div class="photo-ring"></div>
      <div class="photo-circle"></div>
      <div class="seal"><span>D~H</span></div>
    </div>

    <div class="features">
      <div class="row"><span class="num">01</span><span class="label">Human Hair</span></div>
      <div class="row"><span class="num">02</span><span class="label">Raw Hair</span></div>
      <div class="row"><span class="num">03</span><span class="label">Virgin Hair</span></div>
      <div class="row"><span class="num">04</span><span class="label">Wig Tools</span></div>
      <div class="row"><span class="num">05</span><span class="label">Hair Maintenance Kits</span></div>
    </div>

    <div class="tagline">
      <p>“Giving you the best.”</p>
      <div class="rule"></div>
    </div>

    <div class="callout">
      <h2>Luxury Hair<br>&amp; <em>Wigs</em></h2>
    </div>

    <div class="footer">
      <div class="cta">Contact Us</div>
      <div class="contact-group">
        <div class="contact-item">
          <div class="ic">&#9742;</div>
          <div class="txt"><div class="lbl">Phone</div><div class="val">+2349021570977</div></div>
        </div>
        <div class="contact-item">
          <div class="ic">&#127760;</div>
          <div class="txt"><div class="lbl">Website</div><div class="val">d-hairs.vercel.app</div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
