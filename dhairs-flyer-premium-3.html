<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D~Hairs — Luxury Hair &amp; Wigs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F3D36;
    --wine:#1B5C50;
    --wine-deep:#123832;
    --gold:#3FAF9B;
    --gold-dark:#1F7A68;
    --gold-soft:#BFEFE4;
    --ivory:#F2FBF8;
    --blush:#D8F3EC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    font-family:'Jost', sans-serif;
    background:var(--wine-deep);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .stage{
    width:1024px; height:1024px;
    transform-origin:center center;
    flex:none;
  }
  .flyer{
    position:relative;
    width:1024px; height:1024px;
    background:
      radial-gradient(circle at 82% 14%, rgba(63,175,155,0.10), transparent 42%),
      linear-gradient(180deg, var(--ivory) 0%, var(--ivory) 82%, var(--wine-deep) 82%, var(--wine-deep) 100%);
  }

  /* faint texture lines */
  .flyer::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(115deg, rgba(15,61,54,0.02) 0px, rgba(15,61,54,0.02) 1px, transparent 1px, transparent 5px);
    pointer-events:none;
  }

  .frame-line{
    position:absolute; top:36px; left:36px; right:36px; bottom:150px;
    border:1px solid rgba(15,61,54,0.35);
  }
  .frame-line::after{
    content:"";
    position:absolute; inset:6px;
    border:1px solid rgba(63,175,155,0.55);
  }

  .logo{
    position:absolute; top:58px; left:70px;
    display:flex; align-items:center; gap:20px;
  }
  .logo-mark{
    position:relative;
    width:74px; height:74px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #2C7A6C, var(--wine-deep) 72%);
    border:2.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(18,56,50,0.35), inset 0 0 0 4px rgba(191,239,228,0.12);
  }
  .logo-mark::after{
    content:"";
    position:absolute; inset:6px; border-radius:50%;
    border:1px solid rgba(191,239,228,0.65);
  }
  .logo-mark span{
    position:relative; z-index:1;
    color:var(--gold-soft); font-family:'Cormorant Garamond', serif; font-size:34px; font-style:italic; font-weight:600;
  }
  .logo-text .name{
    font-family:'Cormorant Garamond', serif;
    font-weight:700; letter-spacing:4px; font-size:27px; color:var(--ink);
  }
  .logo-text .rule{
    width:100%; height:1px; background:linear-gradient(90deg, var(--gold-dark), transparent); margin:6px 0 6px;
  }
  .logo-text .tag{
    font-size:11px; letter-spacing:3.5px; color:var(--gold-dark); text-transform:uppercase; font-weight:600;
  }

  .headline{
    position:absolute; top:172px; left:70px; width:460px;
  }
  .headline .eyebrow{
    font-size:13px; letter-spacing:6px; color:var(--gold-dark); text-transform:uppercase; margin-bottom:14px; font-weight:600;
    display:flex; align-items:center; gap:14px;
  }
  .headline .eyebrow::after{
    content:""; height:1px; flex:1; background:linear-gradient(90deg, var(--gold-dark), transparent);
  }
  .headline h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:88px;
    line-height:0.92;
    color:var(--ink);
    letter-spacing:0.5px;
  }
  .headline h1 em{
    font-style:italic; font-weight:600; color:var(--gold-dark);
  }
  .headline .sub{
    margin-top:20px; font-size:15px; letter-spacing:4px; color:var(--wine-deep); text-transform:uppercase; font-weight:600;
  }

  .photo-wrap{
    position:absolute; top:140px; right:64px;
    width:410px; height:410px;
  }
  .photo-ring{
    position:absolute; inset:-14px; border-radius:50%;
    border:1.5px solid var(--gold);
  }
  .photo-ring::after{
    content:""; position:absolute; inset:8px; border-radius:50%;
    border:1px solid rgba(63,175,155,0.5);
  }
